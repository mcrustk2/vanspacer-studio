<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[v6.9] Van Spacer Studio - Live 3D Builder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e2e8f0; color: #1e293b; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top:0; left:0; z-index: 1; }
        #laser-canvas { width: 100vw; height: 100vh; display: block; position: absolute; top:0; left:0; z-index: 2; pointer-events: none; }
        
        #ui-sidebar {
            position: absolute; top: 0; right: 0; width: 340px; height: 100vh;
            background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255,255,255,0.1); padding: 20px;
            display: flex; flex-direction: column; gap: 12px; z-index: 10;
            box-shadow: -8px 0 32px rgba(0,0,0,0.3); overflow-y: auto; color: #f8fafc;
        }
        
        .app-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        h1 { margin: 0; font-size: 1.35rem; color: #38bdf8; font-weight: 800; letter-spacing: -0.5px; }
        .version-tag { font-size: 0.65rem; background: #0284c7; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 600; }

        .accordion-item { border: 1px solid #334155; border-radius: 8px; overflow: hidden; background: #1e293b; }
        .accordion-header {
            padding: 12px 14px; background: #1e293b; font-size: 0.85rem; font-weight: 700;
            color: #38bdf8; cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; text-transform: uppercase; letter-spacing: 0.5px; user-select: none;
        }
        .accordion-header:hover { background: #273549; }
        .accordion-header::after { content: '▲'; font-size: 0.65rem; transition: transform 0.2s; }
        .accordion-item.collapsed .accordion-header::after { transform: rotate(180deg); }
        .accordion-content { padding: 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #334155; }
        .accordion-item.collapsed .accordion-content { display: none; }

        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
        select, button, input[type=range] {
            width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155;
            color: #f8fafc; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease;
        }
        select:hover, button:hover { background: #1e293b; border-color: #38bdf8; }
        button.primary { background: #0284c7; border-color: #38bdf8; font-weight: 600; color: #fff; }
        button.active { background: #059669; border-color: #10b981; }

        .library-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .item-card {
            background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px;
            text-align: center; cursor: pointer; font-size: 0.78rem; transition: all 0.2s ease;
        }
        .item-card:hover { border-color: #38bdf8; background: #1e293b; }
        .item-card strong { display: block; color: #f8fafc; margin-bottom: 2px; }

        .gizmo-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
        .gizmo-controls button { font-size: 0.75rem; padding: 6px; }

        /* Vertical Height Bar Styling */
        #height-slider-container {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            height: 280px; width: 48px; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px); border: 1px solid #334155; border-radius: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 14px 0; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .height-label { font-size: 0.65rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
        .height-val { font-size: 0.72rem; font-weight: 700; color: #f8fafc; }
        
        .vertical-slider-wrapper {
            height: 180px; display: flex; align-items: center; justify-content: center;
        }
        .vertical-slider-wrapper input[type=range] {
            transform: rotate(-90deg); width: 160px; height: 6px;
            accent-color: #38bdf8; cursor: pointer; outline: none;
        }

        #info-banner {
            position: absolute; bottom: 20px; left: 20px; background: rgba(15, 23, 42, 0.9);
            padding: 12px 20px; border-radius: 8px; border: 1px solid #334155; font-size: 0.82rem; color: #94a3b8;
            backdrop-filter: blur(8px); z-index: 5;
        }
        .highlight { color: #38bdf8; font-weight: 700; }
    </style>
    <!-- Three.js + GLTFLoader, DRACOLoader & TransformControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        // Global variables and scope bindings
        let renderer, camera, scene, controls, transformControls, clipPlane, vanGroup = null;
        let bodyMaterial, rimMaterial, tyreMaterial, glassMaterial, seatMaterial;
        let rimMeshes = [], tyreMeshes = [], bulkheadMeshes = [];
        let furnitureObjects = [], selectedFurniture = null;
        let clippingEnabled = true, bulkheadVisible = true, measureMode = false;
        
        // Laser tracking state
        let firstWorldPoint = null;
        let hoverWorldPoint = null;
        let persistentPairs = []; // Locked laser line pairs

        let laserCtx = null;
        let raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();

        window.toggleAccordion = function(header) { header.parentElement.classList.toggle('collapsed'); };

        window.updateCutaway = function(val) {
            if (clipPlane) clipPlane.constant = parseFloat(val);
        };

        window.updateCameraHeight = function(val) {
            const h = parseFloat(val);
            if (camera && controls) {
                camera.position.y = h;
                controls.update();
            }
            const readout = document.getElementById('height-readout');
            if (readout) readout.innerText = `${(h * 100).toFixed(2)} cm`;
        };

        window.toggleCutawayPlane = function() {
            if (!renderer) return;
            clippingEnabled = !clippingEnabled;
            renderer.localClippingEnabled = clippingEnabled;
            document.getElementById('status-text').innerText = clippingEnabled ? "Roof Cutaway Active" : "Full Van Active";
        };

        // Project a 3D World Vector to 2D Screen Canvas Coordinates
        function worldToScreen(worldVec) {
            if (!camera) return { x: 0, y: 0 };
            const v = worldVec.clone();
            v.project(camera);
            return {
                x: (v.x * 0.5 + 0.5) * window.innerWidth,
                y: -(v.y * 0.5 - 0.5) * window.innerHeight
            };
        }

        // Draw 2D Overlay Laser Lines
        function drawLaserCanvas() {
            if (!laserCtx) return;
            laserCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            if (!measureMode) return;

            laserCtx.lineWidth = 4;
            laserCtx.strokeStyle = '#ef4444'; // Bright Red Laser
            laserCtx.fillStyle = '#ef4444';

            // 1. Draw Persistent Locked Lines
            persistentPairs.forEach(pair => {
                const p1 = worldToScreen(pair.p1);
                const p2 = worldToScreen(pair.p2);

                laserCtx.beginPath();
                laserCtx.moveTo(p1.x, p1.y);
                laserCtx.lineTo(p2.x, p2.y);
                laserCtx.stroke();

                // Start/End Dots
                laserCtx.beginPath(); laserCtx.arc(p1.x, p1.y, 5, 0, Math.PI * 2); laserCtx.fill();
                laserCtx.beginPath(); laserCtx.arc(p2.x, p2.y, 5, 0, Math.PI * 2); laserCtx.fill();
            });

            // 2. Draw Live Rubber-Banding Tracking Line
            if (firstWorldPoint && hoverWorldPoint) {
                const p1 = worldToScreen(firstWorldPoint);
                const p2 = worldToScreen(hoverWorldPoint);

                laserCtx.beginPath();
                laserCtx.setLineDash([6, 6]); // Dashed line for dynamic tracking
                laserCtx.moveTo(p1.x, p1.y);
                laserCtx.lineTo(p2.x, p2.y);
                laserCtx.stroke();
                laserCtx.setLineDash([]); // Reset line dash

                laserCtx.beginPath(); laserCtx.arc(p1.x, p1.y, 6, 0, Math.PI * 2); laserCtx.fill();
                laserCtx.beginPath(); laserCtx.arc(p2.x, p2.y, 4, 0, Math.PI * 2); laserCtx.fill();
            }
        }

        window.toggleMeasureTool = function() {
            measureMode = !measureMode;
            firstWorldPoint = null;
            hoverWorldPoint = null;

            const btn = document.getElementById('measure-toggle');
            
            if (!measureMode) {
                persistentPairs = [];
                if (laserCtx) laserCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                if (btn) {
                    btn.innerText = "Laser Measure: OFF";
                    btn.style.background = "#0284c7";
                }
                document.getElementById('status-text').innerText = "Laser Tool Disabled & Lines Cleared";
            } else {
                if (btn) {
                    btn.innerText = "Laser Measure: ON (Click Start)";
                    btn.style.background = "#ef4444";
                }
                document.getElementById('status-text').innerText = "Click initial point on van to anchor laser line";
            }
        };

        window.setGizmoMode = function(mode) {
            if (transformControls) transformControls.setMode(mode);
            document.getElementById('mode-translate').classList.toggle('active', mode === 'translate');
            document.getElementById('mode-scale').classList.toggle('active', mode === 'scale');
        };

        window.deleteSelectedFurniture = function() {
            if (selectedFurniture) {
                transformControls.detach();
                scene.remove(selectedFurniture);
                furnitureObjects = furnitureObjects.filter(o => o !== selectedFurniture);
                selectedFurniture = null;
                document.getElementById('status-text').innerText = "Deleted Selected Furniture Piece";
            }
        };

        window.changeVanColor = function(hexStr) {
            if (bodyMaterial) bodyMaterial.color.setHex(parseInt(hexStr, 16));
        };

        window.changeRimColor = function(hexStr) {
            const hex = parseInt(hexStr, 16);
            if (rimMaterial) rimMaterial.color.setHex(hex);
            rimMeshes.forEach(m => m.material && m.material.color.setHex(hex));
        };

        window.changeTyreColor = function(hexStr) {
            const hex = parseInt(hexStr, 16);
            if (tyreMaterial) tyreMaterial.color.setHex(hex);
            tyreMeshes.forEach(m => m.material && m.material.color.setHex(hex));
        };

        window.toggleBulkhead = function() {
            if (!vanGroup) return;
            bulkheadVisible = !bulkheadVisible;
            bulkheadMeshes.forEach(mesh => mesh.visible = bulkheadVisible);
            const btn = document.getElementById('bulkhead-toggle');
            if (btn) {
                btn.innerText = bulkheadVisible ? "Bulkhead: Included" : "Bulkhead: Hidden";
                btn.classList.toggle('active', !bulkheadVisible);
            }
        };

        window.setViewMode = function(mode) {
            const btn3d = document.getElementById('view-3d');
            const btnTop = document.getElementById('view-top');
            if (btn3d) btn3d.classList.toggle('active', mode === '3d');
            if (btnTop) btnTop.classList.toggle('active', mode === 'top');

            if (camera && controls) {
                if (mode === 'top') {
                    camera.position.set(0, 10, 0);
                    controls.target.set(0, 0, 0);
                    document.getElementById('cam-height-slider').value = 10.0;
                    document.getElementById('height-readout').innerText = "1000.00 cm";
                } else {
                    camera.position.set(6.5, 4.2, 7.5);
                    controls.target.set(0, 0.8, 0);
                    document.getElementById('cam-height-slider').value = 4.2;
                    document.getElementById('height-readout').innerText = "420.00 cm";
                }
                controls.update();
            }
        };

        window.spawnFurniture = function(type) {
            if (!scene) return;

            let geom, color, dimensionsLabel;
            if (type === 'bed') {
                geom = new THREE.BoxGeometry(1.4, 0.45, 1.8);
                color = 0x3b82f6;
                dimensionsLabel = "180.00 cm x 140.00 cm Bed";
            } else if (type === 'kitchen') {
                geom = new THREE.BoxGeometry(0.5, 0.85, 1.2);
                color = 0x10b981;
                dimensionsLabel = "120.00 cm x 50.00 cm Kitchenette";
            } else if (type === 'sofa') {
                geom = new THREE.BoxGeometry(0.6, 0.45, 1.5);
                color = 0xf59e0b;
                dimensionsLabel = "150.00 cm x 60.00 cm Sofa Bed";
            } else {
                geom = new THREE.BoxGeometry(0.5, 1.4, 0.6);
                color = 0x8b5cf6;
                dimensionsLabel = "60.00 cm x 50.00 cm Cabinet";
            }

            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const item = new THREE.Mesh(geom, mat);
            item.position.set(0, 0.35, -0.5);
            scene.add(item);
            furnitureObjects.push(item);

            selectedFurniture = item;
            transformControls.attach(item);

            document.getElementById('status-text').innerText = `Placed ${dimensionsLabel}. Drag handles to move/scale!`;
        };
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <canvas id="laser-canvas"></canvas>

    <!-- Vertical Relative Camera Height Control Bar -->
    <div id="height-slider-container">
        <span class="height-label">Height</span>
        <div class="vertical-slider-wrapper">
            <input type="range" id="cam-height-slider" min="0.2" max="8.0" step="0.1" value="4.2" oninput="updateCameraHeight(this.value)">
        </div>
        <span id="height-readout" class="height-val">420.00 cm</span>
    </div>

    <div id="ui-sidebar">
        <div class="app-header">
            <h1>Van Spacer Studio</h1>
            <span class="version-tag">v6.9 Matrix Calibrated</span>
        </div>

        <!-- ACCORDION 1: CHASSIS & VIEWS -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">1. Chassis & Views</div>
            <div class="accordion-content">
                <div>
                    <label for="wheelbase">Vehicle Model</label>
                    <select id="wheelbase">
                        <option value="L1">Ford Transit Custom L1 (SWB)</option>
                        <option value="L2">Ford Transit Custom L2 (LWB)</option>
                    </select>
                </div>
                <div>
                    <label>View Mode</label>
                    <button id="view-3d" class="active" onclick="setViewMode('3d')">3D Orbit Mode</button>
                    <button id="view-top" style="margin-top:4px;" onclick="setViewMode('top')">2D Top Floorplan</button>
                </div>
                <div>
                    <label>Roof Cut Height</label>
                    <input type="range" id="clip-slider" min="0.2" max="2.2" step="0.05" value="1.45" oninput="updateCutaway(this.value)">
                </div>
                <div>
                    <button id="cutaway-toggle" class="primary" onclick="toggleCutawayPlane()">Toggle Roof Cutaway</button>
                </div>
                <div>
                    <button id="bulkhead-toggle" onclick="toggleBulkhead()">Bulkhead: Included</button>
                </div>
                <div>
                    <button id="measure-toggle" style="background:#0284c7; margin-top:6px;" onclick="toggleMeasureTool()">Laser Measure: OFF</button>
                </div>
            </div>
        </div>

        <!-- ACCORDION 2: PAINT & FINISHES -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">2. Paint & Finishes</div>
            <div class="accordion-content">
                <div>
                    <label for="paint-color">Van Paint Colour</label>
                    <select id="paint-color" onchange="changeVanColor(this.value)">
                        <option value="0x4b5563" selected>Steel Grey (High Contrast)</option>
                        <option value="0x1f2937">Magnetic Charcoal Dark</option>
                        <option value="0x9ca3af">Moondust Silver</option>
                        <option value="0x1e3a8a">Diffused Slate Blue</option>
                        <option value="0xe5e7eb">Frozen White</option>
                    </select>
                </div>
                <div>
                    <label for="rim-color">Wheel Rim Colour</label>
                    <select id="rim-color" onchange="changeRimColor(this.value)">
                        <option value="0x9ca3af" selected>Silver Alloy</option>
                        <option value="0x111827">Gloss / Satin Black</option>
                        <option value="0x4b5563">Steel Grey</option>
                    </select>
                </div>
                <div>
                    <label for="tyre-color">Tyre Rubber Colour</label>
                    <select id="tyre-color" onchange="changeTyreColor(this.value)">
                        <option value="0x111827" selected>Matte Black Rubber</option>
                        <option value="0x1f2937">Dark Slate Tyre</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- ACCORDION 3: ASSET LIBRARY & GIZMOS -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">3. Asset Library</div>
            <div class="accordion-content">
                <div class="library-grid">
                    <div class="item-card" onclick="spawnFurniture('bed')">
                        <strong>Fixed Platform Bed</strong>
                        <span style="color:#64748b;">180.00 cm x 140.00 cm</span>
                    </div>
                    <div class="item-card" onclick="spawnFurniture('kitchen')">
                        <strong>Kitchenette Unit</strong>
                        <span style="color:#64748b;">120.00 cm x 50.00 cm</span>
                    </div>
                    <div class="item-card" onclick="spawnFurniture('sofa')">
                        <strong>Bench / Sofa Bed</strong>
                        <span style="color:#64748b;">150.00 cm x 60.00 cm</span>
                    </div>
                    <div class="item-card" onclick="spawnFurniture('cabinet')">
                        <strong>Tall Cabinet</strong>
                        <span style="color:#64748b;">60.00 cm x 50.00 cm</span>
                    </div>
                </div>

                <div style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 8px;">
                    <label>Furniture Gizmo Mode</label>
                    <div class="gizmo-controls">
                        <button id="mode-translate" class="active" onclick="setGizmoMode('translate')">Move (Position)</button>
                        <button id="mode-scale" onclick="setGizmoMode('scale')">Scale (Size)</button>
                    </div>
                    <button style="margin-top: 6px; background: #dc2626; border-color: #ef4444;" onclick="deleteSelectedFurniture()">Delete Selected Piece</button>
                </div>
            </div>
        </div>
    </div>

    <div id="info-banner">
        Status: <span id="status-text" class="highlight">Initializing Engine...</span>
    </div>

    <script>
        // Real-time mouse movement listener for dynamic laser tracking
        window.addEventListener('mousemove', (event) => {
            if (!measureMode || !firstWorldPoint || !vanGroup || !camera) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(vanGroup.children, true);

            if (intersects.length > 0) {
                // Correct for matrix World transformation
                const rawPoint = intersects[0].point;
                hoverWorldPoint = rawPoint.clone();

                // Calculate exact physical distance in centimeters (1 World Unit = 100 cm)
                const distCm = (firstWorldPoint.distanceTo(hoverWorldPoint) * 100).toFixed(2);
                document.getElementById('status-text').innerText = `Laser Tracking: ${distCm} cm (Click to Lock)`;
                drawLaserCanvas();
            }
        });

        // Click interaction handler
        window.addEventListener('click', (event) => {
            if (event.clientX > window.innerWidth - 340 || event.clientX < 80) return;
            if (!camera || !scene) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (measureMode && vanGroup) {
                const intersects = raycaster.intersectObjects(vanGroup.children, true);
                if (intersects.length > 0) {
                    const rawPoint = intersects[0].point;
                    const clickedWorldPoint = rawPoint.clone();

                    if (!firstWorldPoint) {
                        firstWorldPoint = clickedWorldPoint;
                        document.getElementById('status-text').innerText = `First Point Set! Move cursor to track laser distance.`;
                    } else {
                        const finalDistCm = (firstWorldPoint.distanceTo(clickedWorldPoint) * 100).toFixed(2);

                        // Save persistent pair for 2D overlay rendering
                        persistentPairs.push({ p1: firstWorldPoint.clone(), p2: clickedWorldPoint.clone() });

                        firstWorldPoint = null;
                        hoverWorldPoint = null;

                        document.getElementById('status-text').innerText = `Laser Measurement Locked: ${finalDistCm} cm`;
                        drawLaserCanvas();
                    }
                }
                return;
            }

            if (furnitureObjects.length > 0) {
                const furnitureHits = raycaster.intersectObjects(furnitureObjects, true);
                if (furnitureHits.length > 0) {
                    selectedFurniture = furnitureHits[0].object;
                    transformControls.attach(selectedFurniture);
                    document.getElementById('status-text').innerText = "Selected Furniture Piece - Use handles to Move/Scale";
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const statusText = document.getElementById('status-text');

            const laserCanvas = document.getElementById('laser-canvas');
            laserCanvas.width = window.innerWidth;
            laserCanvas.height = window.innerHeight;
            laserCtx = laserCanvas.getContext('2d');

            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0xe2e8f0);

                camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.set(6.5, 4.2, 7.5);
                scene.add(camera);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.0;
                renderer.localClippingEnabled = true;
                container.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.target.set(0, 0.8, 0);

                controls.addEventListener('change', () => {
                    const slider = document.getElementById('cam-height-slider');
                    const readout = document.getElementById('height-readout');
                    if (slider && camera) {
                        slider.value = camera.position.y;
                        if (readout) readout.innerText = `${(camera.position.y * 100).toFixed(2)} cm`;
                    }
                    drawLaserCanvas(); // Redraw 2D laser overlay dynamically during orbit
                });

                transformControls = new THREE.TransformControls(camera, renderer.domElement);
                transformControls.addEventListener('dragging-changed', (event) => {
                    controls.enabled = !event.value;
                });
                scene.add(transformControls);

                clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1.45);

                // Camera Headlight
                const cameraLight = new THREE.DirectionalLight(0xffffff, 1.2);
                cameraLight.position.set(0, 2, 4);
                camera.add(cameraLight);

                const hemiLight = new THREE.HemisphereLight(0xffffff, 0x475569, 0.9);
                scene.add(hemiLight);

                const grid = new THREE.GridHelper(14, 28, 0x0284c7, 0xc2c7d0);
                grid.position.y = -0.01;
                scene.add(grid);

                statusText.innerText = "Requesting GLB Model...";

                const gltfLoader = new THREE.GLTFLoader();
                const dracoLoader = new THREE.DRACOLoader();
                dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/libs/draco/');
                gltfLoader.setDRACOLoader(dracoLoader);

                bodyMaterial = new THREE.MeshStandardMaterial({
                    color: 0x4b5563, roughness: 0.45, metalness: 0.35, side: THREE.DoubleSide, clippingPlanes: [clipPlane]
                });
                tyreMaterial = new THREE.MeshStandardMaterial({
                    color: 0x111827, roughness: 0.9, metalness: 0.05, side: THREE.DoubleSide, clippingPlanes: [clipPlane]
                });
                rimMaterial = new THREE.MeshStandardMaterial({
                    color: 0x9ca3af, roughness: 0.3, metalness: 0.7, side: THREE.DoubleSide, clippingPlanes: [clipPlane]
                });
                glassMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff, transparent: true, opacity: 0.35, roughness: 0.1, metalness: 0.9, side: THREE.DoubleSide, clippingPlanes: [clipPlane]
                });
                seatMaterial = new THREE.MeshStandardMaterial({
                    color: 0x374151, roughness: 0.7, metalness: 0.1, side: THREE.DoubleSide, clippingPlanes: [clipPlane]
                });

                function processAndAddGLB(gltf) {
                    vanGroup = gltf.scene;
                    vanGroup.rotation.x = -Math.PI / 2;

                    const box = new THREE.Box3().setFromObject(vanGroup);
                    const size = box.getSize(new THREE.Vector3());
                    const scaleFactor = 4.973 / Math.max(size.x, size.y, size.z);
                    vanGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);

                    const scaledBox = new THREE.Box3().setFromObject(vanGroup);
                    const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
                    vanGroup.position.x = -scaledCenter.x;
                    vanGroup.position.y = -scaledBox.min.y;
                    vanGroup.position.z = -scaledCenter.z;

                    vanGroup.updateMatrixWorld(true);

                    rimMeshes = []; tyreMeshes = []; bulkheadMeshes = [];

                    vanGroup.traverse((child) => {
                        if (child.isMesh) {
                            child.geometry.computeVertexNormals();
                            const name = child.name.toLowerCase();

                            if (name.includes('bulkhead')) bulkheadMeshes.push(child);
                            if (name.includes('rims') || name.includes('rim')) { child.material = rimMaterial; rimMeshes.push(child); }
                            else if (name.includes('tyres') || name.includes('tyre') || name.includes('tire')) { child.material = tyreMaterial; tyreMeshes.push(child); }
                            else if (name.includes('glass') || name.includes('window') || name.includes('windscreen')) child.material = glassMaterial;
                            else if (name.includes('seat')) child.material = seatMaterial;
                            else child.material = bodyMaterial;
                        }
                    });

                    scene.add(vanGroup);
                    statusText.innerText = "Loaded Transit Custom - v6.9 Matrix Calibrated Engine!";
                }

                gltfLoader.load(
                    'assets/models/ford-transit-custom-optimized.glb',
                    (gltf) => processAndAddGLB(gltf),
                    undefined,
                    () => {
                        gltfLoader.load('assets/models/ford-transit-custom-optimised.glb', (gltf) => processAndAddGLB(gltf));
                    }
                );

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    laserCanvas.width = window.innerWidth;
                    laserCanvas.height = window.innerHeight;
                    drawLaserCanvas();
                });

                function animate() {
                    requestAnimationFrame(animate);
                    if (controls) controls.update();
                    if (renderer && scene && camera) renderer.render(scene, camera);
                    drawLaserCanvas();
                }
                animate();

            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
