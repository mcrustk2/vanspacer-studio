<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Spacer Studio - Live 3D Builder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            display: block; 
            position: absolute; 
            top:0; 
            left:0; 
            z-index: 1; 
        }
        
        #ui-sidebar {
            position: absolute; 
            top: 0; 
            right: 0; 
            width: 340px; 
            height: 100vh;
            background: rgba(15, 23, 42, 0.94); 
            backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255,255,255,0.1); 
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            z-index: 10;
            box-shadow: -8px 0 32px rgba(0,0,0,0.4); 
            overflow-y: auto; 
            color: #f8fafc;
        }
        
        .app-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding-bottom: 12px; 
            border-bottom: 1px solid #334155; 
        }
        h1 { 
            margin: 0; 
            font-size: 1.25rem; 
            color: #38bdf8; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
        }
        .version-tag { 
            font-size: 0.65rem; 
            background: #0284c7; 
            color: #fff; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-weight: 600; 
        }

        .accordion-item { 
            border: 1px solid #334155; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #1e293b; 
        }
        .accordion-header {
            padding: 12px 14px; 
            background: #1e293b; 
            font-size: 0.85rem; 
            font-weight: 700;
            color: #38bdf8; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between;
            align-items: center; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            user-select: none;
        }
        .accordion-header:hover { background: #273549; }
        .accordion-header::after { 
            content: '▲'; 
            font-size: 0.65rem; 
            transition: transform 0.2s; 
        }
        .accordion-item.collapsed .accordion-header::after { transform: rotate(180deg); }
        .accordion-content { 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            border-top: 1px solid #334155; 
        }
        .accordion-item.collapsed .accordion-content { display: none; }

        label { 
            display: block; 
            font-size: 0.8rem; 
            color: #94a3b8; 
            margin-bottom: 6px; 
            font-weight: 500; 
        }
        select, button, input[type=range] {
            width: 100%; 
            padding: 8px 12px; 
            background: #0f172a; 
            border: 1px solid #334155;
            color: #f8fafc; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        select:hover, button:hover { 
            background: #1e293b; 
            border-color: #38bdf8; 
        }
        button.primary { 
            background: #0284c7; 
            border-color: #38bdf8; 
            font-weight: 600; 
            color: #fff; 
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-val-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .library-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
        }
        .item-card {
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            padding: 10px;
            text-align: center; 
            cursor: pointer; 
            font-size: 0.78rem;
            transition: all 0.2s ease;
        }
        .item-card:hover { 
            border-color: #38bdf8; 
            background: #1e293b; 
        }
        .item-card strong { 
            display: block; 
            color: #f8fafc; 
            margin-bottom: 2px; 
        }

        #info-banner {
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 20px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            font-size: 0.82rem; 
            color: #94a3b8;
            backdrop-filter: blur(8px); 
            z-index: 5;
        }
        .highlight { 
            color: #38bdf8; 
            font-weight: 700; 
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-sidebar">
        <div class="app-header">
            <h1>Van Spacer Studio</h1>
            <span class="version-tag">v4.9 Calibrated</span>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">1. Chassis & Views</div>
            <div class="accordion-content">
                <div>
                    <label for="wheelbase">Vehicle Model</label>
                    <select id="wheelbase">
                        <option value="L1">Ford Transit Custom L1 (SWB)</option>
                        <option value="L2">Ford Transit Custom L2 (LWB)</option>
                    </select>
                </div>
                
                <div class="slider-container">
                    <div class="slider-val-row">
                        <label style="margin:0;">Roof Cut Height</label>
                        <span id="slider-val-text">1.45m</span>
                    </div>
                    <input type="range" id="clip-slider" min="0.2" max="2.2" step="0.05" value="1.45" oninput="updateCutaway(this.value)">
                </div>

                <div>
                    <button id="cutaway-toggle" class="primary" onclick="toggleCutawayPlane()">Toggle Cutaway Mode</button>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">2. Asset Library</div>
            <div class="accordion-content">
                <div class="library-grid">
                    <div class="item-card" onclick="addFurniture('Fixed Platform Bed')">
                        <strong>Platform Bed</strong>
                        <span style="color:#64748b;">1.8m x 1.4m</span>
                    </div>
                    <div class="item-card" onclick="addFurniture('Kitchenette Unit')">
                        <strong>Kitchenette</strong>
                        <span style="color:#64748b;">1.2m x 0.5m</span>
                    </div>
                    <div class="item-card" onclick="addFurniture('Bench / Sofa Bed')">
                        <strong>Bench / Sofa</strong>
                        <span style="color:#64748b;">1.5m x 0.6m</span>
                    </div>
                    <div class="item-card" onclick="addFurniture('Tall Storage Cabinet')">
                        <strong>Tall Cabinet</strong>
                        <span style="color:#64748b;">0.6m x 0.5m</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="info-banner">
        Status: <span id="status-text" class="highlight">Initializing Engine...</span>
    </div>

    <script>
        let renderer, clipPlane, clippingEnabled = true;

        function toggleAccordion(header) { 
            header.parentElement.classList.toggle('collapsed'); 
        }

        function updateCutaway(val) {
            if (clipPlane) {
                clipPlane.constant = parseFloat(val);
                document.getElementById('slider-val-text').innerText = `${parseFloat(val).toFixed(2)}m`;
            }
        }

        function toggleCutawayPlane() {
            clippingEnabled = !clippingEnabled;
            renderer.localClippingEnabled = clippingEnabled;
            document.getElementById('status-text').innerText = clippingEnabled ? "Roof Cutaway Enabled" : "Full Vehicle Shell Enabled";
        }

        function addFurniture(name) {
            document.getElementById('status-text').innerText = `Placed ${name} into layout area`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const statusText = document.getElementById('status-text');

            // Scene setup with dark studio slate background for high contrast
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b);

            const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(6.5, 4.2, 7.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.localClippingEnabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0.8, 0);

            // Horizontal Cutaway Plane
            clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1.45);

            // Calibrated Lighting to prevent both white-outs and pitch-black shadows
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.6);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
            keyLight.position.set(10, 15, 10);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            const grid = new THREE.GridHelper(14, 28, 0x38bdf8, 0x334155);
            grid.position.y = -0.01;
            scene.add(grid);

            statusText.innerText = "Requesting GLB Model...";

            // Standard PBR materials calibrated for clear CAD panel visibility
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x94a3b8,        // Slate silver gray
                roughness: 0.45,        // Diffuse light dispersion to eliminate white hotspots
                metalness: 0.2,         // Moderate metallic look
                side: THREE.DoubleSide,  // Render both interior & exterior sides of sliced geometry
                clippingPlanes: [clipPlane]
            });

            const trimMaterial = new THREE.MeshStandardMaterial({
                color: 0x334155,        // Dark slate accent for tires, wheels, and dash
                roughness: 0.8,
                metalness: 0.1,
                side: THREE.DoubleSide,
                clippingPlanes: [clipPlane]
            });

            const gltfLoader = new THREE.GLTFLoader();
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/libs/draco/');
            gltfLoader.setDRACOLoader(dracoLoader);

            function processAndAddGLB(gltf) {
                const vanGroup = gltf.scene;

                // Auto-Orient wheels onto floor plane
                vanGroup.rotation.x = -Math.PI / 2;

                // Scale Normalization to Ford Transit Custom SWB Length (4.97m)
                const box = new THREE.Box3().setFromObject(vanGroup);
                const size = box.getSize(new THREE.Vector3());
                const currentMaxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 4.97 / currentMaxDim;
                vanGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);

                // Align center to floor grid center
                const scaledBox = new THREE.Box3().setFromObject(vanGroup);
                const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
                vanGroup.position.x = -scaledCenter.x;
                vanGroup.position.y = -scaledBox.min.y;
                vanGroup.position.z = -scaledCenter.z;

                vanGroup.traverse((child) => {
                    if (child.isMesh) {
                        const name = child.name.toLowerCase();
                        if (name.includes('wheel') || name.includes('tire') || name.includes('dashboard') || name.includes('bumper')) {
                            child.material = trimMaterial;
                        } else {
                            child.material = bodyMaterial;
                        }
                    }
                });

                scene.add(vanGroup);
                controls.target.set(0, 0.8, 0);
                statusText.innerText = "Loaded Ford Transit Custom Studio Model!";
            }

            gltfLoader.load(
                'assets/models/ford-transit-custom-optimized.glb',
                (gltf) => processAndAddGLB(gltf),
                (xhr) => {
                    if (xhr.lengthComputable) {
                        const percent = (xhr.loaded / xhr.total) * 100;
                        statusText.innerText = `Downloading Model: ${percent.toFixed(0)}%`;
                    }
                },
                () => {
                    gltfLoader.load(
                        'assets/models/ford-transit-custom-optimised.glb',
                        (gltf) => processAndAddGLB(gltf),
                        undefined,
                        () => {
                            gltfLoader.load(
                                'assets/models/ford-transit-custom.glb',
                                (gltf) => processAndAddGLB(gltf),
                                undefined,
                                (err) => {
                                    console.error('GLB Load Error:', err);
                                    statusText.innerText = "Could not find GLB file in assets/models/";
                                }
                            );
                        }
                    );
                }
            );

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        });
    </script>
</body>
</html>
