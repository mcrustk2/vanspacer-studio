<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[v6.3] Van Spacer Studio - Live 3D Builder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e2e8f0; color: #1e293b; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top:0; left:0; z-index: 1; }
        
        #ui-sidebar {
            position: absolute; top: 0; right: 0; width: 340px; height: 100vh;
            background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255,255,255,0.1); padding: 20px;
            display: flex; flex-direction: column; gap: 12px; z-index: 10;
            box-shadow: -8px 0 32px rgba(0,0,0,0.3); overflow-y: auto; color: #f8fafc;
        }
        
        .app-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        h1 { margin: 0; font-size: 1.35rem; color: #38bdf8; font-weight: 800; letter-spacing: -0.5px; }
        .version-tag { font-size: 0.65rem; background: #0284c7; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 600; }

        .accordion-item { border: 1px solid #334155; border-radius: 8px; overflow: hidden; background: #1e293b; }
        .accordion-header {
            padding: 12px 14px; background: #1e293b; font-size: 0.85rem; font-weight: 700;
            color: #38bdf8; cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; text-transform: uppercase; letter-spacing: 0.5px; user-select: none;
        }
        .accordion-header:hover { background: #273549; }
        .accordion-header::after { content: '▲'; font-size: 0.65rem; transition: transform 0.2s; }
        .accordion-item.collapsed .accordion-header::after { transform: rotate(180deg); }
        .accordion-content { padding: 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #334155; }
        .accordion-item.collapsed .accordion-content { display: none; }

        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
        select, button, input[type=range] {
            width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155;
            color: #f8fafc; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease;
        }
        select:hover, button:hover { background: #1e293b; border-color: #38bdf8; }
        button.primary { background: #0284c7; border-color: #38bdf8; font-weight: 600; color: #fff; }
        button.active { background: #059669; border-color: #10b981; }

        .library-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .item-card {
            background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px;
            text-align: center; cursor: pointer; font-size: 0.78rem; transition: all 0.2s ease;
        }
        .item-card:hover { border-color: #38bdf8; background: #1e293b; }
        .item-card strong { display: block; color: #f8fafc; margin-bottom: 2px; }

        .gizmo-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
        .gizmo-controls button { font-size: 0.75rem; padding: 6px; }

        /* Vertical Height Bar Styling */
        #height-slider-container {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            height: 280px; width: 48px; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px); border: 1px solid #334155; border-radius: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 14px 0; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .height-label { font-size: 0.65rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
        .height-val { font-size: 0.72rem; font-weight: 700; color: #f8fafc; }
        
        .vertical-slider-wrapper {
            height: 180px; display: flex; align-items: center; justify-content: center;
        }
        .vertical-slider-wrapper input[type=range] {
            transform: rotate(-90deg); width: 160px; height: 6px;
            accent-color: #38bdf8; cursor: pointer; outline: none;
        }

        #info-banner {
            position: absolute; bottom: 20px; left: 20px; background: rgba(15, 23, 42, 0.9);
            padding: 12px 20px; border-radius: 8px; border: 1px solid #334155; font-size: 0.82rem; color: #94a3b8;
            backdrop-filter: blur(8px); z-index: 5;
        }
        .highlight { color: #38bdf8; font-weight: 700; }
    </style>
    <!-- Three.js + GLTFLoader, DRACOLoader & TransformControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Vertical Relative Camera Height Control Bar -->
    <div id="height-slider-container">
        <span class="height-label">Height</span>
        <div class="vertical-slider-wrapper">
            <input type="range" id="cam-height-slider" min="0.2" max="8.0" step="0.1" value="4.2" oninput="updateCameraHeight(this.value)">
        </div>
        <span id="height-readout" class="height-val">4.2m</span>
    </div>

    <div id="ui-sidebar">
        <div class="app-header">
            <h1>Van Spacer Studio</h1>
            <span class="version-tag">v6.3 Camera Light</span>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">1. Chassis & Views</div>
            <div class="accordion-content">
                <div>
                    <label for="wheelbase">Vehicle Model</label>
                    <select id="wheelbase">
                        <option value="L1">Ford Transit Custom L1 (SWB)</option>
                        <option value="L2">Ford Transit Custom L2 (LWB)</option>
                    </select>
                </div>
                <div>
                    <label>View Mode</label>
                    <button id="view-3d" class="active" onclick="setViewMode('3d')">3D Orbit Mode</button>
                    <button id="view-top" style="margin-top:4px;" onclick="setViewMode('top')">2D Top Floorplan</button>
                </div>
                <div>
                    <label for="paint-color">Van Paint Colour</label>
                    <select id="paint-color" onchange="changeVanColor(this.value)">
                        <option value="0x4b5563" selected>Steel Grey (High Contrast)</option>
                        <option value="0x1f2937">Magnetic Charcoal Dark</option>
                        <option value="0x9ca3af">Moondust Silver</option>
                        <option value="0x1e3a8a">Diffused Slate Blue</option>
                        <option value="0xe5e7eb">Frozen White</option>
                    </select>
                </div>
                <div>
                    <label for="rim-color">Wheel Rim Colour</label>
                    <select id="rim-color" onchange="changeRimColor(this.value)">
                        <option value="0x9ca3af" selected>Silver Alloy</option>
                        <option value="0x111827">Gloss / Satin Black</option>
                        <option value="0x4b5563">Steel Grey</option>
                    </select>
                </div>
                <div>
                    <label for="tyre-color">Tyre Rubber Colour</label>
                    <select id="tyre-color" onchange="changeTyreColor(this.value)">
                        <option value="0x111827" selected>Matte Black Rubber</option>
                        <option value="0x1f2937">Dark Slate Tyre</option>
                    </select>
                </div>
                <div>
                    <label>Roof Cut Height</label>
                    <input type="range" id="clip-slider" min="0.2" max="2.2" step="0.05" value="1.45" oninput="updateCutaway(this.value)">
                </div>
                <div>
                    <button id="cutaway-toggle" class="primary" onclick="toggleCutawayPlane()">Toggle Roof Cutaway</button>
                </div>
                <div>
                    <button id="bulkhead-toggle" onclick="toggleBulkhead()">Bulkhead: Included</button>
                </div>
                <div>
                    <button id="measure-toggle" style="background:#0284c7; margin-top:6px;" onclick="toggleMeasureTool()">Laser Measure: OFF</button>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">2. Asset Library</div>
            <div class="accordion-content">
                <div class="library-grid">
                    <div class="item-card" onclick="spawnFurniture('bed')">
                        <strong>Fixed Platform Bed</strong>
                        <span style="color:#64748b;">1.8m x 1.4m</span>
                    </div>
                    <div class="item-card" onclick="spawnFurniture('kitchen')">
                        <strong>Kitchenette Unit</strong>
                        <span style="color:#64748b;">1.2m x 0.5m</span>
                    </div>
                    <div class="item-card" onclick="spawnFurniture('sofa')">
                        <strong>Bench / Sofa Bed</strong>
                        <span style="color:#64748b;">1.5m x 0.6m</span>
                    </div>
                    <div class="item-card" onclick="spawnFurniture('cabinet')">
                        <strong>Tall Cabinet</strong>
                        <span style="color:#64748b;">0.6m x 0.5m</span>
                    </div>
                </div>

                <div style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 8px;">
                    <label>Furniture Gizmo Mode</label>
                    <div class="gizmo-controls">
                        <button id="mode-translate" class="active" onclick="setGizmoMode('translate')">Move (Position)</button>
                        <button id="mode-scale" onclick="setGizmoMode('scale')">Scale (Size)</button>
                    </div>
                    <button style="margin-top: 6px; background: #dc2626; border-color: #ef4444;" onclick="deleteSelectedFurniture()">Delete Selected Piece</button>
                </div>
            </div>
        </div>
    </div>

    <div id="info-banner">
        Status: <span id="status-text" class="highlight">Initializing Engine...</span>
    </div>

    <script>
        let renderer, camera, scene, controls, transformControls, clipPlane, vanGroup = null;
        let bodyMaterial, rimMaterial, tyreMaterial, glassMaterial, seatMaterial;
        let rimMeshes = [], tyreMeshes = [], bulkheadMeshes = [];
        let furnitureObjects = [], selectedFurniture = null;
        let clippingEnabled = true, bulkheadVisible = true, measureMode = false;
        let measurePoints = [], activeLaserGroup = null;
        let raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();

        function toggleAccordion(header) { header.parentElement.classList.toggle('collapsed'); }

        function updateCutaway(val) {
            if (clipPlane) clipPlane.constant = parseFloat(val);
        }

        function updateCameraHeight(val) {
            const h = parseFloat(val);
            if (camera && controls) {
                camera.position.y = h;
                controls.update();
            }
            const readout = document.getElementById('height-readout');
            if (readout) readout.innerText = `${h.toFixed(1)}m`;
        }

        function toggleCutawayPlane() {
            if (!renderer) return;
            clippingEnabled = !clippingEnabled;
            renderer.localClippingEnabled = clippingEnabled;
            document.getElementById('status-text').innerText = clippingEnabled ? "Roof Cutaway Active" : "Full Van Active";
        }

        function toggleMeasureTool() {
            measureMode = !measureMode;
            measurePoints = [];
            const btn = document.getElementById('measure-toggle');
            
            if (!measureMode) {
                if (activeLaserGroup) {
                    scene.remove(activeLaserGroup);
                    activeLaserGroup = null;
                }
                if (btn) {
                    btn.innerText = "Laser Measure: OFF";
                    btn.style.background = "#0284c7";
                }
                document.getElementById('status-text').innerText = "Laser Tool Disabled & Lines Cleared";
            } else {
                if (!activeLaserGroup) {
                    activeLaserGroup = new THREE.Group();
                    scene.add(activeLaserGroup);
                }
                if (btn) {
                    btn.innerText = "Laser Measure: ON (Click Points)";
                    btn.style.background = "#ef4444";
                }
                document.getElementById('status-text').innerText = "Click any 2 points on van to retain laser line";
            }
        }

        function setGizmoMode(mode) {
            if (transformControls) transformControls.setMode(mode);
            document.getElementById('mode-translate').classList.toggle('active', mode === 'translate');
            document.getElementById('mode-scale').classList.toggle('active', mode === 'scale');
        }

        function deleteSelectedFurniture() {
            if (selectedFurniture) {
                transformControls.detach();
                scene.remove(selectedFurniture);
                furnitureObjects = furnitureObjects.filter(o => o !== selectedFurniture);
                selectedFurniture = null;
                document.getElementById('status-text').innerText = "Deleted Selected Furniture Piece";
            }
        }

        function changeVanColor(hexStr) {
            if (bodyMaterial) bodyMaterial.color.setHex(parseInt(hexStr, 16));
        }

        function changeRimColor(hexStr) {
            const hex = parseInt(hexStr, 16);
            if (rimMaterial) rimMaterial.color.setHex(hex);
            rimMeshes.forEach(m => m.material && m.material.color.setHex(hex));
        }

        function changeTyreColor(hexStr) {
            const hex = parseInt(hexStr, 16);
            if (tyreMaterial) tyreMaterial.color.setHex(hex);
            tyreMeshes.forEach(m => m.material && m.material.color.setHex(hex));
        }

        function toggleBulkhead() {
            if (!vanGroup) return;
            bulkheadVisible = !bulkheadVisible;
            bulkheadMeshes.forEach(mesh => mesh.visible = bulkheadVisible);
            const btn = document.getElementById('bulkhead-toggle');
            if (btn) {
                btn.innerText = bulkheadVisible ? "Bulkhead: Included" : "Bulkhead: Hidden";
                btn.classList.toggle('active', !bulkheadVisible);
            }
        }

        function setViewMode(mode) {
            const btn3d = document.getElementById('view-3d');
            const btnTop = document.getElementById('view-top');
            if (btn3d) btn3d.classList.toggle('active', mode === '3d');
            if (btnTop) btnTop.classList.toggle('active', mode === 'top');

            if (camera && controls) {
                if (mode === 'top') {
                    camera.position.set(0, 10, 0);
                    controls.target.set(0, 0, 0);
                    document.getElementById('cam-height-slider').value = 10.0;
                    document.getElementById('height-readout').innerText = "10.0m";
                } else {
                    camera.position.set(6.5, 4.2, 7.5);
                    controls.target.set(0, 0.8, 0);
                    document.getElementById('cam-height-slider').value = 4.2;
                    document.getElementById('height-readout').innerText = "4.2m";
                }
                controls.update();
            }
        }

        function spawnFurniture(type) {
            if (!scene) return;

            let geom, color;
            if (type === 'bed') {
                geom = new THREE.BoxGeometry(1.4, 0.45, 1.8);
                color = 0x3b82f6;
            } else if (type === 'kitchen') {
                geom = new THREE.BoxGeometry(0.5, 0.85, 1.2);
                color = 0x10b981;
            } else if (type === 'sofa') {
                geom = new THREE.BoxGeometry(0.6, 0.45, 1.5);
                color = 0xf59e0b;
            } else {
                geom = new THREE.BoxGeometry(0.5, 1.4, 0.6);
                color = 0x8b5cf6;
            }

            const mat = new THREE.MeshStandardMaterial({ color
